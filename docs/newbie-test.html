<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>快速上手手冊 - SCM-002</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --text: #e7ecf3;
      --accent: #3d9cf5;
      --ok: #66bb6a;
      --radius: 12px;
    }
    body {
      font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 1rem;
      line-height: 1.6;
    }
    .container {
      max-width: 500px;
      width: 100%;
      background: var(--surface);
      padding: 2rem;
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 { color: var(--accent); font-size: 1.5rem; text-align: center; margin-bottom: 2rem; }
    .step {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding: 1rem;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
    }
    .step-num {
      background: var(--accent);
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }
    .step-content b { color: var(--accent); display: block; margin-bottom: 0.2rem; }
    .step-content p { margin: 0; font-size: 0.95rem; color: #b0c4de; }
    .btn-back {
      display: block;
      text-align: center;
      margin-top: 2rem;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      border: 1px solid var(--accent);
      padding: 0.6rem;
      border-radius: 8px;
    }
    .btn-back:hover { background: rgba(61,156,245,0.1); }
  </style>
</head>
<body>
  <div class="container">
    <h1>快速上手 3 步驟 🚀</h1>
    
    <div class="step">
      <div class="step-num">1</div>
      <div class="step-content">
        <b>載入資料</b>
        <p>點擊左側「選擇檔案」，上傳你的 SCM-002.csv 或 Excel 檔。</p>
      </div>
    </div>

    <div class="step">
      <div class="step-num">2</div>
      <div class="step-content">
        <b>快速查詢</b>
        <p>直接「輸入文字」或按「🎤 語音」說出品項名稱，系統會自動計算補貨量。</p>
      </div>
    </div>

    <div class="step">
      <div class="step-num">3</div>
      <div class="step-content">
        <b>AI 分析</b>
        <p>點擊右下角 ✨ 按鈕，設定一次 API Key 後，即可請 AI 幫你總結庫存風險。</p>
      </div>
    </div>

    <a href="../index.html" class="btn-back">我知道了，回系統</a>
  </div>
</body>
</html>
